# ------------------------------------------------- QUARANTINE (never extracted)
# User decision: excluded from the answer corpus. The bot names why and redirects
# instead of refusing silently. See canon/policy/refusals-and-corrections.md.
quarantine:
  x-cpn-registration:
    source_file: "427596781-How-to-Register-Your-CPN.pdf"
    reason: "Identity/loan fraud. No agency issues CPNs; sold numbers are fabricated or stolen SSNs."
  x-credit-sweeps-cheatsheet:
    source_file: "467052955-Expert-Credit-Sweeps-Cheat-Sheet-Public-View.pdf"
    reason: "False identity-theft reports — false police report + false statement to a federal agency."
  x-credit-card-frauds:
    source_file: "429830134-Credit-Card-Frauds.pdf"
    reason: "Card fraud. Also an image scan (236 chars/page) with no OCR available."
  x-section-609-loophole:
    source_file: "133197114-Section-609-of-the-Fair-Credit-Reporting-Act-Loophole.pdf"
    reason: >
      False, not illegal. FCRA 609 is a disclosure right with no deletion power.
      c.2011 lead magnet citing 2010 RealtyTrac data and HAMP.
  x-7-days-better-credit:
    source_file: "62722813-7-Days-to-Better-Credit-105k (1).pdf"
    reason: >
      Quarantined on review 2026-09-07 (not in the original five). A third of this
      15-page document is a chapter titled "How to Obtain an EIN/TIN (AKA) CPN
      Number", built on the standard pretext that "the Government and Credit
      Bureaus have nothing to do with each other". This is precisely what Coach K's
      own Ch.22 names as "EIN/CPN fraud". The document's premise is the fraud, so
      page-level exclusion is not sufficient.

  x-tradeline-list:
    source_file: "913392606-Tradeline-List.pdf"
    reason: >
      Coaches falsified rent verification ("someone (Family or friend) that can verify
      the info for you") and CPN use ("don't use any cards that have your SSN attached
      to it"). Sells junk catalog cards as tradelines.

