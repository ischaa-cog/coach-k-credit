# Coach K knowledge base — SOURCE OF TRUTH
# Every file in kb/sources/ must appear here or the build fails (30_verify.py).
#
# tier:       1 = Coach K's own material (authority + voice). 2 = third-party support.
# domain:     credit | grants | crosscutting | staff
# canonize:   may this source seed a canon note? (no = search-only, long tail)
# volatility: stable | volatile (vendor lists, bank criteria, approval amounts)
# audience:   member | staff
# fraud_screen: run a page-level grep for CPN/sweep/609/stated-income before indexing
# drive_url:  canonical Google Drive link, present ONLY on Drive-pulled sources. Absent
#             means there is no link to give: ck-part1 (the Master Blueprint) and every
#             tier-2 ebook are staged locally and exist nowhere in this Drive.

meta:
  pdftotext_version: "25.09.0"     # pin: re-extraction with another build must be reviewed
  extracted_with: "pdftotext -layout -enc UTF-8"
  staged_on: "2026-09-07"

